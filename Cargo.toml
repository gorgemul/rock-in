[package]
name = "rock-in"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
rusqlite = { version = "0.41.1", features = ["chrono"]}
notify-rust = { version = "4", features = ["preview-macos-un"] }
dirs = "7.0.0"

[package.metadata.packager]
before-packaging-command = "cargo build --release"
product-name = "rock-in"
identifier = "com.gorgemul.rock-in"
icons = ["asset/icon.icns"]
formats = ["app", "dmg"]

[package.metadata.packager.macos]
signing-identity = "-"
